<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#0d6efd">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
</head>
<body data-page="{% block page %}index{% endblock %}" class="{% block body_class %}{% endblock %}">
{% if user %}
<header class="topbar">
  <a class="brand" href="{{ url_for('web.index') }}">
    <span class="brand-icon">🖨️</span>
    <span class="brand-text">{{ site_name }}</span>
  </a>
  <nav class="nav">
    <a href="{{ url_for('web.index') }}" class="nav-link {% if request.endpoint == 'web.index' %}active{% endif %}">打印</a>
    <a href="{{ url_for('web.history') }}" class="nav-link {% if request.endpoint == 'web.history' %}active{% endif %}">历史</a>
    {% if user.is_admin %}
    <a href="{{ url_for('web.settings_page') }}" class="nav-link {% if request.endpoint == 'web.settings_page' %}active{% endif %}">设置</a>
    {% endif %}
  </nav>
  <div class="topbar-right">
    <span class="who" title="当前账号">
      {{ user.username }}{% if user.is_admin %}<span class="badge admin">管理员</span>{% endif %}
    </span>
    <form method="post" action="{{ url_for('web.logout') }}" class="inline">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <button class="btn tiny ghost" type="submit">退出</button>
    </form>
  </div>
</header>
{% endif %}

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>{{ app_name }} v{{ version }}</span>
  <span class="dot">·</span>
  <span>端口 {{ request.host }}</span>
</footer>

<div class="toast-host" id="toast-host" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
